name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Create Android platform skeleton
        run: flutter create . --platforms=android --org com.marvis --project-name desktop_spirit

      - name: Apply original native overlay source
        run: |
          cp android_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_src/MainActivity.kt android/app/src/main/kotlin/com/marvis/desktop_spirit/MainActivity.kt
          cp android_src/PetOverlayService.kt android/app/src/main/kotlin/com/marvis/desktop_spirit/PetOverlayService.kt
          echo '--- kotlin files ---'
          ls -R android/app/src/main/kotlin

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desktop-spirit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
